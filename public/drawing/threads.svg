<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 205" width="790" height="205" role="img" aria-label="How external and internal threads are drawn">
<title>How external and internal threads are drawn</title>
<defs>
<pattern id="h45" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#23262B" stroke-width="0.9"/></pattern>
<pattern id="h135" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#23262B" stroke-width="0.9"/></pattern>
<pattern id="h45w" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11" stroke="#23262B" stroke-width="0.9"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#23262B"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#2F6FA8"/></marker>
</defs>
<rect width="790" height="205" fill="#FFFDF9"/>
<g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M40,80 L255,80 L260,85 L260,135 L255,140 L40,140" stroke="#23262B" stroke-width="2.4" fill="none"/>
<line x1="40.0" y1="80.0" x2="40.0" y2="140.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="5 3"/>
<line x1="130.0" y1="85.0" x2="260.0" y2="85.0" stroke="#23262B" stroke-width="1.0"/>
<line x1="130.0" y1="135.0" x2="260.0" y2="135.0" stroke="#23262B" stroke-width="1.0"/>
<line x1="130.0" y1="80.0" x2="130.0" y2="140.0" stroke="#23262B" stroke-width="2.4"/>
<line x1="30.0" y1="110.0" x2="272.0" y2="110.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<text x="150" y="26" font-size="13" fill="#2F6FA8" stroke="none" text-anchor="middle" font-weight="700">EXTERNAL (bolt)</text>
<text x="195" y="74" font-size="11" fill="#6B6F76" stroke="none" text-anchor="middle" font-weight="500">thin = root (minor Ø)</text>
<text x="130" y="162" font-size="11" fill="#6B6F76" stroke="none" text-anchor="middle" font-weight="500">thick line = end of full thread</text>
<circle cx="330" cy="110" r="30" stroke="#23262B" stroke-width="2.4" fill="none"/>
<path d="M327.8,85.1 A25,25 0 1 0 354.9,107.8" stroke="#23262B" stroke-width="1.0" fill="none"/>
<line x1="290.0" y1="110.0" x2="370.0" y2="110.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<line x1="330.0" y1="70.0" x2="330.0" y2="150.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<text x="330" y="162" font-size="11" fill="#6B6F76" stroke="none" text-anchor="middle" font-weight="500">thick circle = major Ø</text>
<text x="330" y="176" font-size="11" fill="#6B6F76" stroke="none" text-anchor="middle" font-weight="500">thin ¾ circle = minor Ø</text>
<path d="M430,50 L640,50 L640,170 L430,170 L430,135 L540,135 L570,130 L590,110 L570,90 L540,85 L430,85 Z" stroke="#23262B" stroke-width="2.4" fill="url(#h45)"/>
<line x1="540.0" y1="85.0" x2="540.0" y2="135.0" stroke="#23262B" stroke-width="2.4"/>
<line x1="430.0" y1="80.0" x2="540.0" y2="80.0" stroke="#23262B" stroke-width="1.0"/>
<line x1="430.0" y1="140.0" x2="540.0" y2="140.0" stroke="#23262B" stroke-width="1.0"/>
<line x1="420.0" y1="110.0" x2="650.0" y2="110.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<text x="535" y="26" font-size="13" fill="#2F6FA8" stroke="none" text-anchor="middle" font-weight="700">INTERNAL (tapped hole) in section</text>
<text x="430" y="186" font-size="11" fill="#2F7D6D" stroke="none" text-anchor="start" font-weight="500">hatching runs to the THICK line</text>
<circle cx="720" cy="110" r="25" stroke="#23262B" stroke-width="2.4" fill="none"/>
<path d="M717.4,80.1 A30,30 0 1 0 749.9,107.4" stroke="#23262B" stroke-width="1.0" fill="none"/>
<line x1="680.0" y1="110.0" x2="760.0" y2="110.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<line x1="720.0" y1="70.0" x2="720.0" y2="150.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<text x="720" y="162" font-size="11" fill="#6B6F76" stroke="none" text-anchor="middle" font-weight="500">thick = minor Ø (hole)</text>
<text x="720" y="176" font-size="11" fill="#6B6F76" stroke="none" text-anchor="middle" font-weight="500">thin ¾ = major Ø</text>
</g>
</svg>
