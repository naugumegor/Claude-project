<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-label="Line types of a mechanical drawing">
<title>Line types of a mechanical drawing</title>
<defs>
<pattern id="h45" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#23262B" stroke-width="0.9"/></pattern>
<pattern id="h135" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#23262B" stroke-width="0.9"/></pattern>
<pattern id="h45w" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11" stroke="#23262B" stroke-width="0.9"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#23262B"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#2F6FA8"/></marker>
</defs>
<rect width="620" height="330" fill="#FFFDF9"/>
<g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="30.0" y1="40.0" x2="240.0" y2="40.0" stroke="#23262B" stroke-width="2.4"/>
<text x="265" y="37" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Continuous wide</text>
<text x="265" y="53" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">outlines, visible edges</text>
<line x1="30.0" y1="82.0" x2="240.0" y2="82.0" stroke="#23262B" stroke-width="1.0"/>
<text x="265" y="79" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Continuous narrow</text>
<text x="265" y="95" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">dimension and leader lines, hatching</text>
<path d="M30,120.0 L40,129.7 L50,121.8 L60,128.3 L70,118.5 L80,126.1 L90,119.4 L100,129.3 L110,122.0 L120,128.8 L130,118.9 L140,126.0 L150,118.9 L160,128.8 L170,122.0 L180,129.3 L190,119.4 L200,126.1 L210,118.5 L220,128.3 L230,121.8 L240,129.7" stroke="#23262B" stroke-width="1.0" fill="none"/>
<text x="265" y="121" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Freehand / zig-zag narrow</text>
<text x="265" y="137" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">break lines, broken-out section limit</text>
<line x1="30.0" y1="166.0" x2="240.0" y2="166.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="265" y="163" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Dashed narrow</text>
<text x="265" y="179" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">hidden edges</text>
<line x1="30.0" y1="208.0" x2="240.0" y2="208.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3"/>
<text x="265" y="205" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Long-dash dotted narrow</text>
<text x="265" y="221" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">centre &amp; symmetry lines, cutting plane</text>
<line x1="30.0" y1="250.0" x2="240.0" y2="250.0" stroke="#23262B" stroke-width="1.0" stroke-dasharray="14 3 2 3 2 3"/>
<text x="265" y="247" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Long-dash double-dotted</text>
<text x="265" y="263" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">end positions, bend lines, adjacent parts</text>
<line x1="30.0" y1="292.0" x2="240.0" y2="292.0" stroke="#B9BCC2" stroke-width="0.7"/>
<text x="265" y="289" font-size="13" fill="#23262B" stroke="none" text-anchor="start" font-weight="600">Very light narrow</text>
<text x="265" y="305" font-size="12" fill="#6B6F76" stroke="none" text-anchor="start" font-weight="400">construction lines only</text>
</g>
</svg>
